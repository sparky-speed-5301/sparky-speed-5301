name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # refreshes daily at 00:00 UTC
  workflow_dispatch:       # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write          # required, or the push step fails with 403

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Empty tiles = GitHub's native dark graph color, commits in blue ramp, orange snake
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF7A42&color_dots=%23161B22,%231E40AF,%232D4BFF,%234D6BFF,%2300D4FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF7A42&color_dots=%23161B22,%231E40AF,%232D4BFF,%234D6BFF,%2300D4FF

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
